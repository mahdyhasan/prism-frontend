name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python: lint + typecheck + tests ─────────────────────────────────────
  python:
    name: Python (lint / typecheck / tests)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: prism_test
          MYSQL_USER: prism
          MYSQL_PASSWORD: prism
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    env:
      PRISM_ENV: dev
      PRISM_DATABASE_URL: mysql+aiomysql://prism:prism@localhost:3306/prism_test
      PRISM_REDIS_URL: redis://localhost:6379/0
      PRISM_TOKEN_ENCRYPTION_KEY: ${{ secrets.PRISM_TOKEN_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
      PRISM_JWT_SECRET: test-secret
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e "apps/api[dev]"

      - name: Ruff lint
        run: ruff check apps/api/

      - name: Black format check
        run: black --check apps/api/

      - name: mypy typecheck
        run: mypy apps/api/prism/

      - name: pytest
        run: pytest apps/api/tests/ -v --tb=short

  # ── Frontend: lint + typecheck + build ───────────────────────────────────
  frontend:
    name: Frontend (lint / typecheck / build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter prism-web lint

      - name: Typecheck
        run: pnpm --filter prism-web typecheck

      - name: Build
        run: pnpm --filter prism-web build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret
